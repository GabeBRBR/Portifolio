<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 52 396 396" width="100%" height="100%">
  <!-- Variante para tamanhos pequenos (barra de topo) do símbolo Apollo:
       recorte justo, traços mais grossos e sem os detalhes finos do original. -->
  <defs>
    <mask id="hingeCutout">
      <rect width="500" height="500" fill="white" />
      <circle cx="250" cy="197" r="19" fill="black" />
    </mask>
  </defs>

  <g fill="none" stroke="#141820" stroke-linecap="round">
    <!-- Anel externo -->
    <circle cx="250" cy="250" r="188" stroke-width="12" />
    <!-- Anel interno, mais fino -->
    <circle cx="250" cy="250" r="168" stroke-width="5" opacity="0.55" />

    <!-- Compasso em "A": travessa e pernas -->
    <line x1="196" y1="300" x2="304" y2="300" stroke-width="15" />
    <g mask="url(#hingeCutout)">
      <line x1="250" y1="197" x2="182" y2="352" stroke-width="18" />
      <line x1="250" y1="197" x2="318" y2="352" stroke-width="18" />
    </g>

    <!-- Articulação -->
    <circle cx="250" cy="197" r="19" stroke-width="10" />
    <circle cx="250" cy="197" r="6" fill="#141820" stroke="none" />
  </g>
</svg>
