<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Petrol Blue Primary Gradient (based on apollo-simbolo-dark.svg palette) -->
    <linearGradient id="apolloPetrol" x1="120" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#232A36" />
      <stop offset="35%" stop-color="#181D26" />
      <stop offset="75%" stop-color="#141820" />
      <stop offset="100%" stop-color="#11141B" />
    </linearGradient>

    <!-- Refined Petrol Blue for Drafting System -->
    <linearGradient id="apolloPetrolDrafting" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181D26" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#11141B" stop-opacity="0.82" />
    </linearGradient>

    <!-- Mask to keep the hinge ring center genuinely transparent over the compass legs -->
    <mask id="hingeCutout">
      <rect width="500" height="500" fill="white" />
      <circle cx="250" cy="197" r="8.5" fill="black" />
    </mask>
  </defs>

  <!-- ================= 1. DRAFTING GUIDE SYSTEM ================= -->
  <g id="drafting-guides" stroke="url(#apolloPetrolDrafting)">
    <!-- Concentric Outer Rings -->
    <circle cx="250" cy="250" r="188" fill="none" stroke-width="1.8" />
    <circle cx="250" cy="250" r="170" fill="none" stroke-width="1.1" opacity="0.85" />

    <!-- Center Drafting Circle (Passing Behind Compass) -->
    <circle cx="250" cy="246" r="49" fill="none" stroke-width="1.6" opacity="0.95" />

    <!-- Outer Ring Ticks (Crossing both concentric rings) -->
    <!-- Top Tick (12 o'clock / 90 deg) -->
    <line x1="250" y1="52" x2="250" y2="88" stroke-width="1.8" stroke-linecap="round" />
    <!-- Bottom Tick (6 o'clock / 270 deg) -->
    <line x1="250" y1="412" x2="250" y2="448" stroke-width="1.8" stroke-linecap="round" />
    <!-- East Tick (~21 deg above horizontal) -->
    <line x1="402.0" y1="191.0" x2="433.0" y2="179.0" stroke-width="1.8" stroke-linecap="round" />
    <!-- West Tick (~159 deg above horizontal) -->
    <line x1="98.0" y1="191.0" x2="67.0" y2="179.0" stroke-width="1.8" stroke-linecap="round" />

    <!-- Cardinal Drafting Rays -->
    <!-- Horizontal Left Ray -->
    <line x1="125" y1="246" x2="195" y2="246" stroke-width="1.6" stroke-linecap="round" />
    <!-- Horizontal Right Ray -->
    <line x1="305" y1="246" x2="375" y2="246" stroke-width="1.6" stroke-linecap="round" />
    <!-- Vertical Top Ray (Above Hinge) -->
    <line x1="250" y1="186" x2="250" y2="125" stroke-width="1.6" stroke-linecap="round" />
    <!-- Vertical Bottom Ray (Below Compass) -->
    <line x1="250" y1="298" x2="250" y2="378" stroke-width="1.6" stroke-linecap="round" />

    <!-- Diagonal Upper Ticks (45 deg and 135 deg) -->
    <line x1="309.4" y1="186.6" x2="332.0" y2="164.0" stroke-width="1.8" stroke-linecap="round" />
    <line x1="190.6" y1="186.6" x2="168.0" y2="164.0" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- ================= 2. COMPASS / 'A' (PRIMARY SUBJECT) ================= -->
  <g id="compass-glyph">
    <!-- Middle Horizontal Crossbar (A bar) -->
    <line x1="202" y1="295" x2="298" y2="295" stroke="url(#apolloPetrol)" stroke-width="3.8" stroke-linecap="round" />

    <!-- Compass Legs (masked at hinge joint to preserve transparent interior) -->
    <g mask="url(#hingeCutout)">
      <line x1="250" y1="197" x2="188" y2="345" stroke="url(#apolloPetrol)" stroke-width="4.5" stroke-linecap="round" />
      <line x1="250" y1="197" x2="312" y2="345" stroke="url(#apolloPetrol)" stroke-width="4.5" stroke-linecap="round" />
    </g>

    <!-- Top Circular Hinge Joint -->
    <circle cx="250" cy="197" r="8.5" fill="none" stroke="url(#apolloPetrol)" stroke-width="2.5" />
    <circle cx="250" cy="197" r="2.8" fill="url(#apolloPetrol)" />
  </g>
</svg>
